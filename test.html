<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>PhavoSense 자가 점검</title>
<body style="font:14px/1.6 monospace;padding:24px;background:#20201E;color:#EBE7DD">
<h1 style="font:600 18px sans-serif">PhavoSense 자가 점검 (CSV 파서 · 회원 상태 · 공개 범위 · 통계 · 이스케이프)</h1>
<pre id="out"></pre>
<div hidden><a id="skip"></a><header id="header"></header><main id="app"></main><footer id="footer"></footer><div id="wm"></div><div id="cookie"></div><dialog id="dlg"></dialog><div id="toast"></div></div>
<script>window.PHAVO_TEST = true; // app.js 가 화면을 그리지 않게 한다</script>
<script src="js/lang/ko.js"></script>
<script src="js/lang/en.js"></script>
<script src="js/lang/ar.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
const results = [];
const ok = (name, cond) => results.push((cond ? 'PASS  ' : 'FAIL  ') + name);
const throws = fn => { try { fn(); return false; } catch { return true; } };
const HEAD = 'date,region,supplier,farm,batch,cordycepin,adenosine\n';

const good = parseCSV('﻿' + HEAD + '2026-01-05,gb,S-A,F01,B1,2.35,0.88\r\n2026-01-06,CB,S-B,F02,B2,1.9,0.7');
ok('CSV: 2행 읽기 · 지역 대문자 · 숫자 변환 · BOM/CRLF 처리', good.length === 2 && good[0].region === 'GB' && good[1].cordycepin === 1.9);
ok('CSV: 필요한 열이 빠지면 거부', throws(() => parseCSV('date,region\n2026-01-01,GB')));
ok('CSV: 날짜 형식이 틀리면 거부', throws(() => parseCSV(HEAD + '2026/01/05,GB,S,F,B,1,1')));
ok('CSV: 숫자가 아니면 거부', throws(() => parseCSV(HEAD + '2026-01-05,GB,S,F,B,abc,1')));
ok('CSV: 음수 함량 거부', throws(() => parseCSV(HEAD + '2026-01-05,GB,S,F,B,-1,1')));
ok('CSV: 데이터 행이 없으면 거부', throws(() => parseCSV(HEAD)));
ok('CSV: 없는 날짜(13월 · 2월 30일) 거부', throws(() => parseCSV(HEAD + '2026-13-05,GB,S,F,B,1,1')) && throws(() => parseCSV(HEAD + '2026-02-30,GB,S,F,B,1,1')));
ok('CSV: 목록에 없는 지역 코드 거부', throws(() => parseCSV(HEAD + '2026-01-05,GBB,S,F,B,1,1')));

const now = Date.now();
ok('상태: 승인 + 유효기간 남음 → 통과', access({ status: 'approved', expiresAt: now + DAY }) === 'ok');
ok('상태: 승인 기간 끝남 → 만료', access({ status: 'approved', expiresAt: now - 1 }) === 'expired');
ok('상태: 대기·반려·정지는 그대로 막힘', ['pending', 'rejected', 'suspended'].every(s => access({ status: s }) === s));
ok('상태: 관리자는 통과', access({ role: 'admin', status: 'approved' }) === 'ok');
ok('상태: 없는 회원 → none', access(undefined) === 'none');

db = seed(); // 관리자가 바꾼 공개 설정과 상관없이 기본값으로 검사 (저장은 안 함)
const ids = u => visibleDatasets(u).map(d => d.id).join();
ok('공개 범위: 농가는 정부 전용 지역별 분포를 못 보고 우리 농가는 봄', !ids({ group: 'farm' }).includes('region') && ids({ group: 'farm' }).includes('myfarm'));
db.settings.datasets.trend.published = false;
ok('공개 범위: 게시를 끈 데이터는 아무도 못 봄 · 관리자는 나머지 전부', !ids({ group: 'gov' }).includes('trend') && ids({ role: 'admin' }) === DATASETS.filter(d => d.id !== 'trend').map(d => d.id).join());

ok('통계: 평균 · 변동계수 · 빈 값', mean([1, 2, 3]) === 2 && Math.abs(cv([1, 2, 3]) - 50) < 1e-9 && cv([5]) === null && mean([]) === null);
ok('통계: 기준치 충족률', passRate([{ cordycepin: 2 }, { cordycepin: 1.99 }]) === 50 && passRate([]) === null);
ok('월 범위: 빈 달 채움 · 연도 넘김', monthRange('2025-11', '2026-02').join() === '2025-11,2025-12,2026-01,2026-02');
ok('인증번호: 6자리 숫자', Array.from({ length: 50 }, code6).every(c => /^\d{6}$/.test(c)));
ok('보안: HTML 이스케이프', esc('<img onerror=x>"\'&') === '&lt;img onerror=x&gt;&quot;&#39;&amp;');
ok('날짜: KST 기준 표기', ymd(Date.parse('2026-10-31T16:00:00Z')) === '2026-11-01');

const fails = results.filter(r => r.startsWith('FAIL')).length;
document.getElementById('out').textContent = results.join('\n') + `\n\n${fails ? `실패 ${fails}건` : '모두 통과'} (${results.length}건)`;
document.title = fails ? 'FAIL' : 'PASS';
</script>
</body>
</html>
